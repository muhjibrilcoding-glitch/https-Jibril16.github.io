<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Comments - Luthfi Halimawan</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            color: #e0e0e0;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: #00BFFF;
            color: #000;
            padding: 30px;
            border-radius: 15px 15px 0 0;
            box-shadow: 0 10px 30px rgba(0,191,255,.3);
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 30px;
            background: #1a1a1a;
            padding: 30px;
            border-radius: 0 0 15px 15px;
            box-shadow: 0 15px 40px rgba(0,0,0,.5);
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: linear-gradient(180deg,#2a2a2a 0%,#1a1a1a 100%);
            padding: 30px 20px;
            border-radius: 15px;
            border-left: 5px solid #00BFFF;
            box-shadow:
                0 10px 30px rgba(0,191,255,.15),
                inset 0 1px 0 rgba(0,191,255,.1);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .sidebar h3 {
            color: #00BFFF;
            font-size: 1.2em;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 2px solid #00BFFF;
        }

        .menu-button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 15px;
            background: #00BFFF;
            color: #000;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all .3s ease;
            text-align: center;
            border: 2px solid #00BFFF;
            box-shadow: 0 4px 12px rgba(0,191,255,.2);
            font-size: .95em;
        }

        .menu-button:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,191,255,.4);
        }

        .menu-button.active {
            box-shadow: 0 8px 25px rgba(0,191,255,.4);
        }

        .sidebar img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            border: 3px solid #00BFFF;
            box-shadow: 0 10px 25px rgba(0,191,255,.25);
        }

        .content {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .content h2 {
            color: #00BFFF;
            font-size: 1.8em;
            margin: 0 0 15px;
            padding-bottom: 10px;
            border-bottom: 3px solid #00BFFF;
            text-transform: uppercase;
        }

        .comment-form,
        .comments-list {
            background: #222;
            border: 1px solid rgba(0,191,255,.2);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,.25);
        }

        label {
            display: block;
            color: #00BFFF;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input,
        textarea {
            width: 100%;
            background: #111;
            color: #e0e0e0;
            border: 1px solid #444;
            border-radius: 10px;
            padding: 13px 15px;
            font: inherit;
            outline: none;
            transition: .3s;
        }

        input:focus,
        textarea:focus {
            border-color: #00BFFF;
            box-shadow: 0 0 0 3px rgba(0,191,255,.12);
        }

        textarea {
            min-height: 140px;
            resize: vertical;
        }

        .field {
            margin-bottom: 18px;
        }

        .submit-button {
            width: 100%;
            padding: 14px;
            border: 2px solid #00BFFF;
            border-radius: 10px;
            background: #00BFFF;
            color: #000;
            font-weight: 700;
            cursor: pointer;
            transition: .3s;
        }

        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,191,255,.35);
        }

        .submit-button:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }

        .comment-card {
            padding: 18px 0;
            border-bottom: 1px solid #333;
        }

        .comment-card:last-child {
            border-bottom: none;
        }

        .comment-name {
            color: #00BFFF;
            font-weight: 700;
            font-size: 1.05em;
        }

        .comment-time {
            color: #777;
            font-size: .8em;
            margin-left: 8px;
        }

        .comment-text {
            margin-top: 7px;
            color: #d0d0d0;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .reaction-buttons {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .reaction-button {
            padding: 8px 14px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #111;
            color: #e0e0e0;
            font-weight: 600;
            cursor: pointer;
            transition: .3s;
        }

        .reaction-button:hover {
            border-color: #00BFFF;
            transform: translateY(-1px);
        }

        .reaction-button.liked {
            background: #00BFFF;
            color: #000;
            border-color: #00BFFF;
        }

        .reaction-button.disliked {
            background: #555;
            color: #fff;
            border-color: #777;
        }

        .delete-button {
            margin-top: 12px;
            padding: 8px 14px;
            border: 1px solid #ff5555;
            border-radius: 8px;
            background: #ff3333;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: .3s;
        }

        .delete-button:hover {
            background: #cc0000;
            transform: translateY(-1px);
        }

        .empty {
            color: #888;
            text-align: center;
            padding: 15px 0;
        }

        .loading {
            color: #00BFFF;
            text-align: center;
            padding: 20px 0;
        }

        .error {
            color: #ff6666;
            text-align: center;
            padding: 15px;
            background: rgba(255,0,0,.08);
            border: 1px solid rgba(255,0,0,.2);
            border-radius: 10px;
        }

        .footer {
            background: linear-gradient(135deg,#0f0f0f 0%,#1a1a1a 100%);
            color: #999;
            text-align: center;
            padding: 20px;
            border-top: 2px solid #00BFFF;
            border-radius: 0 0 15px 15px;
        }

        @media(max-width:768px) {
            .layout {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 20px;
            }

            .sidebar {
                position: static;
                padding: 20px 15px;
            }

            .header h1 {
                font-size: 1.8em;
            }
        }

        @media(max-width:480px) {
            body {
                padding: 10px;
            }

            .layout {
                padding: 15px;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header class="header">
        <h1>Biodata Luthfi Halimawan</h1>
    </header>

    <div class="layout">

        <aside class="sidebar">

            <h3>Menu</h3>

            <a class="menu-button" href="index.html">
                Beranda
            </a>

            <a class="menu-button" href="tentang-saya.html">
                Tentang Saya
            </a>

            <a class="menu-button" href="data-diri.html">
                Data Diri
            </a>

            <a class="menu-button" href="media-sosial.html">
                Media Sosial
            </a>

            <a class="menu-button active" href="comments.html">
                Comments
            </a>

            <h3>Foto</h3>

            <img
                src="images (1).jpg"
                alt="Luthfi Halimawan"
                width="300"
            >

        </aside>

        <main class="content">

            <h2>Comments</h2>

            <section class="comment-form">

                <form id="commentForm">

                    <div class="field">
                        <label for="name">
                            Nama
                        </label>

                        <input
                            id="name"
                            name="name"
                            type="text"
                            placeholder="Masukkan nama kamu"
                            maxlength="50"
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="comment">
                            Comment
                        </label>

                        <textarea
                            id="comment"
                            name="comment"
                            placeholder="Tulis comment kamu di sini..."
                            maxlength="500"
                            required
                        ></textarea>
                    </div>

                    <button
                        class="submit-button"
                        id="submitButton"
                        type="submit"
                    >
                        Kirim Comment
                    </button>

                </form>

            </section>

            <section class="comments-list">

                <div id="commentsContainer">
                    <p class="loading">
                        Memuat comment...
                    </p>
                </div>

            </section>

        </main>

    </div>

    <footer class="footer">
        <p>&copy; 2026 Luthfi Halimawan</p>
    </footer>

</div>


<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
    "https://rstooyvedyfsmgfahkap.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_gCqJVr5vxrPScAL2aDjxLw_9KrpItjA";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   ELEMENT
   ========================================================= */

const form =
    document.getElementById("commentForm");

const container =
    document.getElementById("commentsContainer");

const submitButton =
    document.getElementById("submitButton");


/* =========================================================
   USER ID
   ========================================================= */

const USER_KEY =
    "luthfi_comment_user_id";

let userId =
    localStorage.getItem(USER_KEY);

if (!userId) {

    userId =
        "user_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .substring(2, 12);

    localStorage.setItem(
        USER_KEY,
        userId
    );
}


/* =========================================================
   FORMAT WAKTU
   ========================================================= */

function formatTime(dateString) {

    if (!dateString) {
        return "";
    }

    const date =
        new Date(dateString);

    return date.toLocaleString(
        "id-ID",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


/* =========================================================
   LOAD COMMENTS
   ========================================================= */

async function loadComments() {

    container.innerHTML =
        '<p class="loading">Memuat comment...</p>';

    const {
        data,
        error
    } = await supabaseClient
        .from("comments")
        .select("*")
        .order(
            "created_at",
            {
                ascending: false
            }
        );

    if (error) {

        console.error(
            "Gagal mengambil comment:",
            error
        );

        container.innerHTML =
            '<p class="error">Gagal memuat comment. Periksa koneksi Supabase.</p>';

        return;
    }

    renderComments(data || []);
}


/* =========================================================
   RENDER COMMENTS
   ========================================================= */

function renderComments(comments) {

    container.innerHTML = "";

    if (!comments.length) {

        container.innerHTML =
            '<p class="empty">Belum ada comment. Jadilah yang pertama!</p>';

        return;
    }

    comments.forEach(function(comment) {

        const card =
            document.createElement("article");

        card.className =
            "comment-card";


        /* NAMA + WAKTU */

        const top =
            document.createElement("div");

        const name =
            document.createElement("span");

        name.className =
            "comment-name";

        name.textContent =
            comment.name;


        const time =
            document.createElement("span");

        time.className =
            "comment-time";

        time.textContent =
            formatTime(
                comment.created_at
            );


        top.appendChild(name);
        top.appendChild(time);


        /* ISI COMMENT */

        const text =
            document.createElement("p");

        text.className =
            "comment-text";

        text.textContent =
            comment.comment;


        card.appendChild(top);
        card.appendChild(text);


        /* REACTION */

        const reactions =
            document.createElement("div");

        reactions.className =
            "reaction-buttons";


        const likeButton =
            document.createElement("button");

        likeButton.type =
            "button";

        likeButton.className =
            "reaction-button";

        likeButton.textContent =
            "👍 Like " +
            (comment.likes || 0);


        const dislikeButton =
            document.createElement("button");

        dislikeButton.type =
            "button";

        dislikeButton.className =
            "reaction-button";

        dislikeButton.textContent =
            "👎 Dislike " +
            (comment.dislikes || 0);


        /* STATUS REACTION USER */

        const reactionsData =
            comment.reactions || {};

        const myReaction =
            reactionsData[userId] || null;


        if (myReaction === "like") {

            likeButton.classList.add(
                "liked"
            );

        }

        if (myReaction === "dislike") {

            dislikeButton.classList.add(
                "disliked"
            );

        }


        /* LIKE */

        likeButton.addEventListener(
            "click",
            function() {

                reactToComment(
                    comment,
                    "like"
                );

            }
        );


        /* DISLIKE */

        dislikeButton.addEventListener(
            "click",
            function() {

                reactToComment(
                    comment,
                    "dislike"
                );

            }
        );


        reactions.appendChild(
            likeButton
        );

        reactions.appendChild(
            dislikeButton
        );

        card.appendChild(
            reactions
        );


        /* DELETE */

        if (
            comment.owner_id === userId
        ) {

            const deleteButton =
                document.createElement("button");

            deleteButton.type =
                "button";

            deleteButton.className =
                "delete-button";

            deleteButton.textContent =
                "Hapus Comment";


            deleteButton.addEventListener(
                "click",
                function() {

                    deleteComment(
                        comment.id
                    );

                }
            );


            card.appendChild(
                deleteButton
            );
        }


        container.appendChild(
            card
        );

    });
}


/* =========================================================
   TAMBAH COMMENT
   ========================================================= */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const name =
            document
                .getElementById("name")
                .value
                .trim();


        const comment =
            document
                .getElementById("comment")
                .value
                .trim();


        if (!name || !comment) {
            return;
        }


        submitButton.disabled =
            true;

        submitButton.textContent =
            "Mengirim...";


        const {
            error
        } = await supabaseClient
            .from("comments")
            .insert([
                {
                    name: name,
                    comment: comment,
                    owner_id: userId,
                    likes: 0,
                    dislikes: 0,
                    reactions: {}
                }
            ]);


        if (error) {

            console.error(
                "Gagal menambahkan comment:",
                error
            );

            alert(
                "Comment gagal dikirim. Periksa koneksi Supabase."
            );

        } else {

            form.reset();

            await loadComments();

        }


        submitButton.disabled =
            false;

        submitButton.textContent =
            "Kirim Comment";

    }
);


/* =========================================================
   LIKE / DISLIKE
   ========================================================= */

async function reactToComment(
    comment,
    reaction
) {

    const reactions =
        comment.reactions || {};


    const previousReaction =
        reactions[userId] || null;


    let likes =
        Number(comment.likes) || 0;

    let dislikes =
        Number(comment.dislikes) || 0;


    /* KLIK REACTION YANG SAMA
       = BATALKAN */

    if (
        previousReaction ===
        reaction
    ) {

        if (
            reaction === "like" &&
            likes > 0
        ) {
            likes--;
        }

        if (
            reaction === "dislike" &&
            dislikes > 0
        ) {
            dislikes--;
        }

        delete reactions[userId];

    }

    /* GANTI REACTION */

    else {

        if (
            previousReaction === "like" &&
            likes > 0
        ) {
            likes--;
        }

        if (
            previousReaction === "dislike" &&
            dislikes > 0
        ) {
            dislikes--;
        }


        if (reaction === "like") {
            likes++;
        }

        if (reaction === "dislike") {
            dislikes++;
        }


        reactions[userId] =
            reaction;
    }


    const {
        error
    } = await supabaseClient
        .from("comments")
        .update({
            likes: likes,
            dislikes: dislikes,
            reactions: reactions
        })
        .eq(
            "id",
            comment.id
        );


    if (error) {

        console.error(
            "Gagal menyimpan reaction:",
            error
        );

        alert(
            "Reaction gagal disimpan."
        );

        return;
    }


    await loadComments();
}


/* =========================================================
   HAPUS COMMENT
   ========================================================= */

async function deleteComment(
    commentId
) {

    const confirmed =
        confirm(
            "Yakin ingin menghapus comment ini?"
        );


    if (!confirmed) {
        return;
    }


    const {
        error
    } = await supabaseClient
        .from("comments")
        .delete()
        .eq(
            "id",
            commentId
        )
        .eq(
            "owner_id",
            userId
        );


    if (error) {

        console.error(
            "Gagal menghapus comment:",
            error
        );

        alert(
            "Comment gagal dihapus."
        );

        return;
    }


    await loadComments();
}


/* =========================================================
   JALANKAN SAAT HALAMAN DIBUKA
   ========================================================= */

loadComments();

</script>

</body>
</html>
